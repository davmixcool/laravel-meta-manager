name: tests

on:
  push:
    branches: [master, 2.x]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: [10, 11, 12]
        exclude:
          # Laravel 11 and 12 require PHP 8.2+
          - php: '8.1'
            laravel: 11
          - php: '8.1'
            laravel: 12

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Backwards-compatibility suite
        run: vendor/bin/phpunit --testsuite=compatibility

      - name: Full suite
        run: vendor/bin/phpunit
